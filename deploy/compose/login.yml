services:
  redis:
    image: redis@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    mem_limit: 256m
    volumes:
      - ../../.runtime/redis:/usr/local/etc/redis:ro
      - redis-data:/data
volumes:
  redis-data:
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
