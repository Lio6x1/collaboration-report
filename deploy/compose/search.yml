services:
  kafka-volume-init:
    # 固定Kafka镜像的appuser为1000:1000；新命名卷默认归root，必须先修正目录归属。
    # 只处理卷根目录，不递归改动日志、不格式化、不删除已有KRaft元数据。
    image: apache/kafka@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
    user: '0:0'
    entrypoint: /bin/sh
    command: ['-c', 'chown 1000:1000 /tmp/kraft-combined-logs']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    mem_limit: 64m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
    hostname: kafka
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - '127.0.0.1:${KAFKA_PORT}:9092'
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null',
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 10s
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:13bb550524faa2aef6950b13fb6414c73b957e97e6169e5808743c8378614599
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      # 整篇允许24MiB固定正文，ES同时解析父文本与章节定位文本；
      # 实际19MiB验收在256MiB Java heap中OOM退出，不能靠消费者重试恢复容量。
      # heap保持容器预算的一半，留出Lucene/native/page cache；镜像和原数据卷不变。
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - '127.0.0.1:${ES_PORT}:9200'
    mem_limit: 2g
    volumes:
      - es-data:/usr/share/elasticsearch/data
  canal:
    image: canal/canal-server@sha256:5dd84c4d8f6a6755bfb154ed8df1f85ec88c08c11501868d7b0de7b59db7f833
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
    # 镜像外层shell即使Java退出也可能继续运行；先等broker和网络就绪再构造生产者。
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m
      canal.destinations: publication
      canal.auto.scan: 'false'
      canal.serverMode: kafka
      canal.auto.reset.latest.pos.mode: 'false'
      # 复制位置和表结构快照都写实际持久卷；默认conf目录随容器重建会丢失。
      canal.file.data.dir: /home/admin/canal-server/meta
      canal.instance.master.address: mysql:3306
      canal.instance.mysql.slaveId: '18061007'
      canal.instance.dbUsername: collab_canal
      canal.instance.dbPassword: ${CANAL_PASSWORD}
      canal.instance.connectionCharset: UTF-8
      canal.instance.filter.regex: 'document_db\.outbox'
      canal.instance.filter.black.regex: '(mysql|information_schema|performance_schema|sys)\..*'
      canal.instance.parser.parallel: 'false'
      canal.instance.memory.buffer.size: '1024'
      canal.mq.flatMessage: 'true'
      canal.mq.topic: collab-publications-v1
      canal.mq.partitionsNum: '3'
      canal.mq.partitionHash: document_db.outbox:aggregate_id
      canal.mq.database.hash: 'false'
      canal.mq.send.thread.size: '1'
      canal.mq.build.thread.size: '1'
      canal.mq.canalBatchSize: '50'
      kafka.bootstrap.servers: kafka:29092
      kafka.acks: all
      kafka.max.in.flight.requests.per.connection: '1'
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -s /home/admin/canal-server/bin/canal.pid && kill -0 "$$(cat /home/admin/canal-server/bin/canal.pid)"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    volumes:
      - canal-position:/home/admin/canal-server/meta
volumes:
  kafka-data:
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
  es-data:
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
  canal-position:
    labels:
      collaboration.report.owner: ${COLLAB_OWNER}
