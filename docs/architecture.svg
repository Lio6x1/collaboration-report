      <text x="943.5" y="342">Collaboration</text>
    </g>
    <g fill="#4d6258" font-size="14">
      <text x="86" y="226">Vue 3</text>
      <text x="316" y="226">HTTPS 网关</text>
      <text x="594" y="226">Go</text>
      <text x="943.5" y="82">Go</text>
      <text x="943.5" y="226">Go</text>
      <text x="943.5" y="362">Node.js</text>
