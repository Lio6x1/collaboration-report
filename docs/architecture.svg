    <rect x="256" y="179" width="120" height="62" rx="10"/>
    <rect x="855" y="35" width="177" height="62" rx="10"/>
    <rect x="855" y="179" width="177" height="62" rx="10"/>
    <rect x="855" y="315" width="177" height="62" rx="10"/>
  </g>
  <rect x="520" y="179" width="148" height="62" rx="10" fill="#e2efe7" stroke="#7aa68c" stroke-width="1.3"/>

  <g text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <g fill="#1d3028" font-size="19" font-weight="650">
