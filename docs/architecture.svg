<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="410" viewBox="0 0 1056 410" role="img" aria-labelledby="title description">
  <title id="title">协作报告系统架构</title>
  <desc id="description">浏览器通过 Edge 网关访问账号与组织 API、文档与搜索 API，以及实时协作 WebSocket。Document 向 Account 校验身份，与 Collaboration 处理协作票据和合并，与 Search 交换检索候选和发布快照。</desc>
  <defs>
    <marker id="gateway-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#52675d"/>
    </marker>
    <marker id="service-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#245b47"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1054" height="408" rx="17" fill="#f5f8f6" stroke="#d6e1da"/>

  <g fill="none" stroke="#52675d" stroke-width="1.8" marker-end="url(#gateway-arrow)">
    <path d="M148 210 H256"/>
    <path d="M376 210 H520"/>
    <path d="M316 179 V62 Q316 52 326 52 H855"/>
    <path d="M316 241 V350 Q316 360 326 360 H855"/>
